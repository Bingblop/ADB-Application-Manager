name: Build, sign and publish release

# Builds + signs the APKs on a version tag (or a manual run) and publishes them as a GitHub Release: arm64-v8a (64-bit phones),
# armeabi-v7a (32-bit phones) and universal (both).
#
# For a build signed with YOUR key (so it installs as an update over the app on a phone), set these
# repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of release.keystore   (Termux/Linux: base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD  keystore + key password      (build.sh default: password)
#   KEY_ALIAS          optional, defaults to adbmanager
# Without KEYSTORE_BASE64 the run fails: an APK signed with a throwaway key will not install over an existing
# install. For a test run only, start it by hand with "allow_throwaway_key" ticked.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 7.12.9: digits and dots, optional -suffix)'
        required: true
        default: '7.8'
      allow_throwaway_key:
        description: 'Test run only: allow signing with a throwaway key when the KEYSTORE_BASE64 secret is missing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages are 'tools platform-tools', but Google removed the legacy
          # "tools" package from the SDK repo, so the default now fails ("Failed to find package 'tools'").
          # Install only platform-tools here; the next step adds the platform and build-tools.
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Resolve version
        id: v
        env:
          # passed through the environment, never pasted into the script text
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
            echo "::error::The version must be digits separated by dots with an optional -suffix (for example 7.12.9)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALLOW_THROWAWAY: ${{ github.event.inputs.allow_throwaway_key }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=${KEYSTORE_PASSWORD:-password}" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${KEY_ALIAS:-adbmanager}" >> "$GITHUB_ENV"
          elif [ "$ALLOW_THROWAWAY" = "true" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - this test run is signed with a throwaway key and will not install over an existing install."
          else
            echo "::error::KEYSTORE_BASE64 secret not set. Refusing to publish APKs signed with a throwaway key (they would not install over an existing install). Set the secret, or for a test run tick allow_throwaway_key."
            exit 1
          fi

      - name: Build and sign (64-bit, 32-bit and universal)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          for ABI in arm64-v8a armeabi-v7a universal; do
            ABI=$ABI ./build.sh
            case "$ABI" in arm64-v8a) F=bin/ADB_Application_Manager_Pro.apk ;; *) F="bin/ADB_Application_Manager_Pro-$ABI.apk" ;; esac
            cp "$F" "out/ADB_Application_Manager_Pro-v${V}-$ABI.apk"
          done
          ( cd out && sha256sum *.apk > SHA256SUMS.txt )

      - name: Check the signing certificate
        env:
          HAVE_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
          ALLOW_THROWAWAY: ${{ github.event.inputs.allow_throwaway_key }}
          # SHA-256 of the release certificate (also in the README). Change it only when the signing key is replaced on purpose:
          # phones refuse to update an app over one signed with a different certificate.
          EXPECTED_CERT_SHA256: 9461870f7cd2406406a119f4d37533c23bb7d1ed850506bad7ea3e6b4bd26d17
        run: |
          if [ "$HAVE_RELEASE_KEY" != "true" ]; then
            if [ "$ALLOW_THROWAWAY" = "true" ]; then
              echo "::warning::No release key is set, so there is no certificate to check (test run, the APKs carry a throwaway key)."
              exit 0
            fi
            echo "::error::No release key is set, so the signing certificate cannot be checked."
            exit 1
          fi
          bash tools/check-signing-cert.sh "$EXPECTED_CERT_SHA256" out/*.apk

      - name: Extract release notes
        env:
          V: ${{ steps.v.outputs.version }}
        run: awk -v v="$V" 'index($0, "## v" v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ADB Application Manager Pro v${{ steps.v.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          # the 64-bit file is listed first: an older copy of the app that updates itself takes the first .apk of a release
          files: |
            out/ADB_Application_Manager_Pro-v${{ steps.v.outputs.version }}-arm64-v8a.apk
            out/ADB_Application_Manager_Pro-v${{ steps.v.outputs.version }}-armeabi-v7a.apk
            out/ADB_Application_Manager_Pro-v${{ steps.v.outputs.version }}-universal.apk
            out/SHA256SUMS.txt
