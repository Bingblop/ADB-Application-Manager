name: Tests

# Runs the UI scripts (headless Chromium against the real assets/index.html with a mock Android bridge) and the Java suites (the parts of the app that
# need no Android classes) on every pull request. See tests/README.md. A suite whose prerequisite is missing is skipped, not failed.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI scripts
    # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to 26.04 on 2026-10-28 and Playwright 1.56.1 cannot install Chromium there;
    # the expected outputs were recorded on 24.04. Moving needs a Playwright update and newly recorded outputs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the UI scripts
        working-directory: tests
        run: node run.js --jobs 3

      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-test-output
          path: tests/out
          if-no-files-found: ignore
          retention-days: 7

  java:
    name: Java suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Locate Android SDK tools
        run: |
          # The platform and build-tools release.yml builds with (not the newest on the runner), so a change that needs a newer API fails here
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLATFORM="$SDK/platforms/android-34"
          BUILD_TOOLS="$SDK/build-tools/35.0.0"
          if [ ! -f "$PLATFORM/android.jar" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" >/dev/null
          fi
          [ -f "$PLATFORM/android.jar" ] && [ -x "$BUILD_TOOLS/apksigner" ] || { echo "::error::Could not install platforms;android-34 and build-tools;35.0.0."; exit 1; }
          echo "Using $PLATFORM and $BUILD_TOOLS"
          echo "ANDROID_JAR=$PLATFORM/android.jar" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Tools the suites use (a real Android shell and zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mksh toybox zip

      - name: Real org.json and Android framework classes for the parsers
        run: |
          mkdir -p tests/.cache
          curl -fsSL -o tests/.cache/org-json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          curl -fsSL -o tests/.cache/android-all.jar https://repo1.maven.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar
          echo "ANDROID_ALL_JAR=$PWD/tests/.cache/android-all.jar" >> "$GITHUB_ENV"

      - name: Build an APK for the signer suites
        run: |
          echo "KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> "$GITHUB_ENV"
          bash build.sh

      - name: Run the Java suites
        working-directory: tests
        run: node java/run.js
